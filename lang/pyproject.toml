[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spl2"
version = "2.1.0"
description = "Semantic Prompt Language v2 (SPL2) — a syntactic superset of Python for building reliable LLM and agentic workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SPL2 Authors" }
]
dependencies = [
    "openai>=1.60.0",
    "pydantic>=2.0.0",
    "email-validator>=2.0.0",
    "textual>=0.80.0",
    "markdown-it-py>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
spl2 = "spl2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
